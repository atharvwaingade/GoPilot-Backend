<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoPilot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: 390px; min-height: 300px; }

    /* ── Chat history ── */
    .chat-history {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 210px;
      overflow-y: auto;
      padding: 2px 0;
      scroll-behavior: smooth;
    }
    .chat-history::-webkit-scrollbar { width: 3px; }
    .chat-history::-webkit-scrollbar-track { background: transparent; }
    .chat-history::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .chat-bubble {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
      animation: fadeIn 0.18s ease;
    }
    .chat-bubble--you {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--muted);
      align-self: flex-end;
      max-width: 88%;
      font-style: italic;
    }
    .chat-bubble--ai {
      background: rgba(124,106,247,0.08);
      border: 1px solid rgba(124,106,247,0.2);
      color: var(--text);
      align-self: flex-start;
      max-width: 95%;
    }
    .chat-bubble-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 1px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-bubble--ai .chat-bubble-label { color: var(--accent); }
    .chat-replay-inline {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 9px; padding: 0 3px; transition: color 0.12s;
    }
    .chat-replay-inline:hover { color: var(--accent); }

    /* ── Text input row ── */
    .text-input-row { display: flex; gap: 6px; align-items: center; }
    .text-input-row input { flex: 1; }
    .send-btn {
      width: 34px; height: 34px; flex-shrink: 0; border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: #fff; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 2px 10px rgba(124,106,247,0.4); }
    .send-btn:active { transform: scale(0.97); }

    /* ── Settings panel ── */
    .settings-panel-inner {
      background: var(--bg2); border-top: 1px solid var(--border); padding: 12px 14px;
    }

    /* spin animation for processing icon */
    @keyframes spin { to { transform: rotate(360deg); } }
    #spin-icon { transform-origin: center; }
    #spin-icon:not(.hidden) { animation: spin 0.8s linear infinite; }

    /* Legacy compat — hide old result rows that are now in chat history */
    #transcript-row, #response-row, #warning-row, #error-row,
    #mic-label, #mic-ring-pulse { display: none !important; }
  </style>
</head>
<body>
  <!-- ── HEADER ───────────────────────────────────────────────────────────── -->
  <header>
    <div class="logo-row">
      <div class="logo-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="#fff" stroke="none"/>
          <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
      </div>
      <span class="logo-text">GoPilot<span class="logo-tag">AI</span></span>
    </div>
    <div class="header-right">
      <span id="status-label" style="font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;">READY</span>
      <div id="status-dot" class="dot dot--ok"></div>
      <label class="toggle-wrap" title="Proactive mode ON/OFF">
        <input type="checkbox" id="copilot-toggle" />
        <div class="toggle-slider"></div>
        <span id="toggle-label" style="font-size:9px;font-family:var(--mono);color:var(--muted);margin-left:3px;min-width:20px;">OFF</span>
      </label>
      <button id="settings-btn"
        style="background:none;border:none;color:var(--muted);cursor:pointer;padding:3px 5px;font-size:14px;border-radius:4px;line-height:1;transition:color 0.15s;"
        title="Settings">⚙</button>
    </div>
  </header>

  <!-- ── TAB BAR ──────────────────────────────────────────────────────────── -->
  <div class="tab-bar">
    <button class="tab active" data-tab="voice">🎤 Voice</button>
    <button class="tab" data-tab="explain">💡 Explain</button>
    <button class="tab" data-tab="context">📋 Context</button>
    <button class="tab" data-tab="navigate">🧭 Navigate</button>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       VOICE TAB
  ════════════════════════════════════════════════════════════════════════ -->
  <div class="tab-panel" id="tab-voice">

    <!-- Scrollable conversation history -->
    <div id="chat-history" class="chat-history"></div>

    <!-- Quick command chips -->
    <div class="quick-cmds">
      <span class="quick-label">Quick:</span>
      <button class="chip" data-cmd="Explain this page">Explain</button>
      <button class="chip" data-cmd="What's left to fill?">What's left?</button>
      <button class="chip" data-cmd="Fill all required fields">Fill all</button>
      <button class="chip" data-cmd="Undo that">Undo</button>
    </div>

    <!-- Mic button -->
    <div class="voice-center">
      <div class="voice-ring" id="voice-ring">
        <button class="mic-btn" id="mic-btn" title="Tap to speak">
          <svg id="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor" stroke="none"/>
            <path d="M5 11a7 7 0 0 0 14 0"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="9" y1="22" x2="15" y2="22"/>
          </svg>
          <svg id="stop-icon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="6" width="12" height="12" rx="2"/>
          </svg>
          <svg id="spin-icon" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="32 64" stroke-linecap="round">
            <circle cx="12" cy="12" r="10"/>
          </svg>
        </button>
      </div>

      <div class="voice-waveform hidden" id="voice-waveform">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="voice-status-text" id="voice-status">TAP TO SPEAK</div>
    </div>

    <!-- Text input fallback -->
    <div class="text-input-row">
      <input type="text" id="text-input" placeholder="Or type a command…" autocomplete="off" spellcheck="false" />
      <button class="send-btn" id="text-send-btn" title="Send">▶</button>
    </div>

    <!-- Workflow selector -->
    <div class="field-group">
      <label for="workflow-select">Workflow</label>
      <select id="workflow-select">
        <option value="free">Auto-detect</option>
        <option value="purchase">Purchase Order</option>
        <option value="sell">Sales Order</option>
        <option value="supplier">Supplier</option>
      </select>
    </div>

    <!-- Warning / Error (shown inline) -->
    <div class="voice-warning hidden" id="voice-warning-box"></div>
    <div class="error-box hidden" id="voice-error-box">
      <span class="error-icon">⚠</span>
      <span id="voice-error-msg"></span>
    </div>

    <!-- ── Legacy hidden elements required by existing popup.js internals ── -->
    <div id="transcript-row"  class="hidden"><span id="transcript-text"></span></div>
    <div id="response-row"    class="hidden"><span id="response-text"></span><span id="action-chip" class="hidden"></span><button id="replay-btn" class="hidden"></button></div>
    <div id="warning-row"     class="hidden"><span id="warning-text"></span></div>
    <div id="error-row"       class="hidden"><span id="error-text"></span></div>
    <span id="mic-label"      class="hidden"></span>
    <div  id="mic-ring-pulse" class="hidden"></div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       EXPLAIN TAB
  ════════════════════════════════════════════════════════════════════════ -->
  <div class="tab-panel hidden" id="tab-explain">
    <button class="btn btn--run" id="explain-btn">
      <span class="btn-icon">💡</span> Explain This Page
    </button>

    <div id="explain-result" class="result-box hidden">
      <div class="result-header">
        <span class="badge badge--explain">EXPLAIN</span>
        <span id="explain-page-title" style="font-size:11px;color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
      </div>
      <div id="explain-text"
        style="font-size:12px;color:#a0e0c0;line-height:1.6;margin-top:6px;max-height:180px;overflow-y:auto;white-space:pre-wrap;"></div>
    </div>

    <!-- Ask anything -->
    <div style="display:flex;flex-direction:column;gap:5px;margin-top:2px;">
      <label for="explain-question">Ask about this page</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="explain-question" placeholder="What is HSN code?  What fields are required?" autocomplete="off" style="flex:1;" />
        <button class="btn btn--secondary" id="explain-ask-btn" style="width:auto;padding:8px 12px;font-size:12px;white-space:nowrap;">Ask</button>
      </div>
    </div>

    <div class="error-box hidden" id="explain-error-box">
      <span class="error-icon">⚠</span>
      <span id="explain-error-msg"></span>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       CONTEXT TAB
  ════════════════════════════════════════════════════════════════════════ -->
  <div class="tab-panel hidden" id="tab-context">
    <!-- Stats -->
    <div class="stats-row">
      <div class="stat"><span id="stat-total">—</span><small>Fields</small></div>
      <div class="stat"><span id="stat-filled">—</span><small>Filled</small></div>
      <div class="stat"><span id="stat-required">—</span><small>Required</small></div>
      <div class="stat"><span id="stat-missing">—</span><small>Missing</small></div>
    </div>

    <button class="btn btn--secondary" id="scan-btn">
      <span class="btn-icon">🔍</span> Scan Page Fields
    </button>

    <!-- Field list (scrollable) -->
    <div id="field-list" class="field-list"></div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       NAVIGATE TAB
  ════════════════════════════════════════════════════════════════════════ -->
  <div class="tab-panel hidden" id="tab-navigate">
    <!-- Static quick-nav tiles -->
    <div class="nav-grid" id="nav-grid">
      <button class="nav-tile" data-nav="go back"><span class="nav-icon">◀</span>Back</button>
      <button class="nav-tile" data-nav="go home"><span class="nav-icon">🏠</span>Home</button>
      <button class="nav-tile" data-nav="refresh"><span class="nav-icon">↻</span>Refresh</button>
      <button class="nav-tile" data-nav="go to purchase"><span class="nav-icon">🛒</span>Purchase</button>
      <button class="nav-tile" data-nav="go to sales"><span class="nav-icon">💰</span>Sales</button>
      <button class="nav-tile" data-nav="go to supplier"><span class="nav-icon">🏭</span>Supplier</button>
      <button class="nav-tile" data-nav="go to customer"><span class="nav-icon">👤</span>Customer</button>
      <button class="nav-tile" data-nav="go to stock"><span class="nav-icon">📦</span>Stock</button>
      <button class="nav-tile" data-nav="go to dashboard"><span class="nav-icon">📊</span>Dashboard</button>
    </div>

    <!-- Dynamic page links added by JS -->
    <div id="nav-dynamic" style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;min-height:0;"></div>

    <!-- Voice / text nav input -->
    <div style="display:flex;flex-direction:column;gap:5px;margin-top:6px;">
      <label for="nav-input">Navigate by voice or type</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="nav-input" placeholder="go to purchase history…" autocomplete="off" style="flex:1;" />
        <button class="btn btn--run" id="nav-go-btn" style="width:auto;padding:8px 12px;font-size:12px;white-space:nowrap;">Go</button>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       SETTINGS PANEL (slide-in below header)
  ════════════════════════════════════════════════════════════════════════ -->
  <div id="settings-panel" class="settings-panel-inner hidden">
    <label for="backend-url-input">Backend URL</label>
    <input type="text" id="backend-url-input" placeholder="http://localhost:8000" autocomplete="off" />
    <button id="save-backend-btn"
      style="margin-top:8px;padding:5px 14px;border-radius:6px;border:none;background:var(--accent);color:#fff;font-size:11px;font-weight:600;cursor:pointer;letter-spacing:0.03em;">
      Save
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
